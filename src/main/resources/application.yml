server:
    port: 8080

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/splitmate_db?useSSL=false&serverTimezone=UTC
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect

security:
    secret: THIS_IS_A_SECRET_KEY_FOR_SPLITMATE_256_BIT_SECRET
    expiration-ms: 36000000